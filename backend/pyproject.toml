[project]
name = "micro-crm-backend"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "asyncpg>=0.31.0",
    "fastapi>=0.141.1",
    "greenlet>=3.5.5",
    "langchain>=1.3.15",
    "langchain-openai>=1.5.0",
    "langgraph>=1.2.11",
    "pydantic-settings>=2.15.0",
    "python-dotenv>=1.2.2",
    "sqlalchemy>=2.0.52",
    "sse-starlette>=3.4.8",
    "uvicorn[standard]>=0.52.3",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=1.0",
    "httpx>=0.28",
    "ruff>=0.9",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint.per-file-ignores]
# FastAPI's Depends()-in-default-argument is the framework's own idiom, not
# the mutable-default-argument bug B008 exists to catch.
"routers/*.py" = ["B008"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
